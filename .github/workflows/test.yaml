name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor and ceiling of the supported range in pyproject.toml. The
        # suite is offline and pure Python, so the interior versions add little.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest -v --tb=short --color=yes

  build:
    # Catches metadata problems at PR time rather than at release time, when the
    # tag is already pushed and a bad upload cannot be replaced on PyPI.
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
